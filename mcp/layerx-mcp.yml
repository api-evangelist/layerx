note: >-
  LayerX ships no MCP server for Bakuraku — no hosted endpoint, no stdio package, no
  published manifest. This matters to state precisely because LayerX markets heavily on
  AI agents: the バクラクAIエージェント line (証憑取得エージェント, ヘルプデスク
  エージェント, initial-setup agent) is agents LayerX runs INSIDE its own product on the
  customer's behalf. It is not an agent surface a third-party agent can call. LayerX
  engineering has also written about adopting MCP internally so its own staff agents can
  drive AWS, Datadog, GitHub and CLIs — again inward-facing. The direction of travel is
  the opposite of what an MCPServer pointer would assert, so none is emitted.
