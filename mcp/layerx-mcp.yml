candidate_tools_note: >-
  No candidate tool list is derived here. The pipeline derives MCP tool candidates from
  OpenAPI operations, and LayerX publishes no OpenAPI; the six operation names known
  publicly (GetRequest, GetRequests, GetTenantUsers, GetTenantGroups, GetTenantPositions,
  GetTenantUserGroupPositions) come from one integrator's documentation and carry no
  input schemas, so a tool list built from them would be names without contracts. They
  are recorded in mcp/layerx-known-operations.yml instead, clearly attributed.
