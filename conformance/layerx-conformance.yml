api: Bakuraku API
note: >-
  LayerX publishes no OpenAPI, AsyncAPI, GraphQL SDL, .proto or WSDL, so every
  contract-shaped conformance claim below is recorded as unverifiable rather than false —
  there is no contract to read the signature out of. The compliance certifications are
  provider-published and are recorded as conforming with the page that states them.

conformance:
- id: oauth2
  conforms: false
  evidence: >-
    The Bakuraku API authenticates with a permission-scoped API key issued from the admin
    console, not an OAuth 2.0 flow. LayerX does run an Authlete-based OAuth 2.0/OIDC
    server for LayerX ID sign-in (id.layerx.jp), but that is product SSO and is not the
    API's auth mode; it also serves no anonymous discovery document.
  source: https://documents.trocco.io/docs/connection-configuration-bakuraku
- id: oidc
  conforms: false
  evidence: >-
    Probed https://id.layerx.jp/.well-known/openid-configuration — HTTP 200 but the body
    is the sign-in single-page-app HTML shell, which the same host returns for every
    /.well-known/* path. No discovery document is served anonymously.
- id: rfc9457
  conforms: false
  evidence: >-
    Error bodies are application/json with a custom {code, message} envelope, not
    application/problem+json. Observed on
    https://api.bakuraku.layerx.jp/rest/v1/tenant/users, HTTP 400,
    '{"code":3,"message":"不正な値です"}'.
- id: rfc8594
  conforms: false
  evidence: >-
    No Deprecation or Sunset header is documented. Article 5.5 of the API terms
    explicitly reserves the right to change the specification without prior notice, which
    is the opposite of an RFC 8594 posture.
  source: https://bakuraku.jp/terms/api-terms/
- id: idempotency
  conforms: unverifiable
  evidence: >-
    The API has write operations but publishes no idempotency-key header, dedupe window
    or retry-safety statement on any anonymous page, and the reference is HTTP Basic
    gated. Neither asserted nor denied.
- id: pagination
  conforms: unverifiable
  evidence: >-
    A list-search surface is documented in prose ("申請情報の取得・一覧検索") and an
    integrator names a GetRequests list operation, but the paging contract is inside the
    gated reference.
- id: scim
  conforms: unverifiable
  evidence: >-
    Bakuraku exposes a tenant user/group/position directory over the API (GetTenantUsers,
    GetTenantGroups, GetTenantPositions, GetTenantUserGroupPositions per an integrator's
    published mapping), which is the surface SCIM would standardise, but no
    urn:ietf:params:scim:schemas:* URN or /scim/v2 path is published and none could be
    probed anonymously. SAML SSO is supported for tenant login.
- id: rest
  conforms: true
  evidence: >-
    LayerX's own engineering post describes the public surface as a tsoa-built REST API
    over an internal unified GraphQL gateway. Path-versioned at /rest/v1/.
  source: https://tech.layerx.co.jp/entry/2025/04/18/131034

