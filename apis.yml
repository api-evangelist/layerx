x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    The Bakuraku REST API is live and reachable at https://api.bakuraku.layerx.jp/rest —
    it answers anonymous calls with its own JSON error envelope and an x-layerx-request-id
    header — but its reference at /rest/docs/ sits behind HTTP Basic auth at the AWS load
    balancer (401, WWW-Authenticate: Basic), issued only to companies LayerX has approved
    as an "API契約者" on top of an existing Bakuraku subscription, and the API terms state
    the specification document is supplied separately to those customers, so no OpenAPI
    exists at any public URL.
  evidence:
    - url: https://api.bakuraku.layerx.jp/rest/docs/
      status: 401
    - url: https://api.bakuraku.layerx.jp/rest/v1/tenant/users
      status: 400
    - url: https://api.bakuraku.layerx.jp/openapi.json
      status: 404
