aid: layerx
name: LayerX
description: 'LayerX Inc. (株式会社LayerX) is a Tokyo-based enterprise software company founded
  1 August 2018, operating as a compound startup across four business lines: Bakuraku (バクラク),
  an AI back-office suite covering expense reimbursement, invoice receipt and issuance, workflow
  and approvals, electronic bookkeeping, attendance, payroll and a corporate card; Ai Workforce,
  an enterprise LLM document-processing platform; a Fintech business run through the Mitsui-X /
  Mitsui & Co. Digital Asset Management joint venture; and a Security business added through the
  April 2026 acquisition of AgenticSec Inc. Its developer surface is the Bakuraku API — a REST
  API at api.bakuraku.layerx.jp built on an internal unified GraphQL gateway and tsoa, exposing
  application/approval retrieval and creation, attachment download, and tenant user, group and
  position directories. API access is granted by application to existing Bakuraku customers, who
  are issued a scoped API key from the Bakuraku admin console; the API reference at
  /rest/docs/ is HTTP Basic protected and no OpenAPI definition is published publicly.'
