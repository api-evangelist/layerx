apis:
- name: Bakuraku API
  description: 'REST API for the Bakuraku (バクラク) back-office suite. Publicly documented
    capabilities are retrieval and list-search of applications/requests (申請), download of
    attached files, creation of applications for the purchase-request, payment-request and
    general-purpose application types, and read access to the tenant user, group and position
    directory. Bakuraku 請求書発行 additionally exposes document upload (CSV/PDF) and
    recipient-master create/update. Authentication is a scoped API key issued from the Bakuraku
    admin console (API管理). Access requires an existing Bakuraku contract plus a separate API
    application; the reference at https://api.bakuraku.layerx.jp/rest/docs/ answers HTTP 401
    with WWW-Authenticate: Basic to anonymous callers and no OpenAPI is published.'
  humanURL: https://bakuraku.jp/workflow/function/api/
  baseURL: https://api.bakuraku.layerx.jp/rest
