note: >-
  LayerX states plainly that rate limiting exists and that it may be applied without prior
  notice, but publishes no number, no window, and no response-header contract. Article 5.6
  of the バクラクAPI利用規約: "当社は、API契約者に対して事前に通知することなく、本APIの
  負荷状況に応じて本APIの利用の制限をかけることができるものとします" — LayerX may throttle
  API use according to load, without prior notice. Article 7.1.2 additionally prohibits
  "短時間における大量のアクセス" (high-volume access in a short period) as a contract
  violation. An integrator's own setup page repeats the warning that sending many requests
  in a short time can temporarily disable API access. Because no figure is published, this
  records limit_count: 0 rather than inventing one.
