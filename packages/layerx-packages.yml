api_client_sdk_count: 0
note: >-
  LayerX ships NO client library for the Bakuraku API — not in npm, PyPI, Maven Central,
  NuGet, pkg.go.dev, RubyGems, Packagist or crates.io, and not in either of its GitHub
  organisations. Integrators call the REST API directly or reach it through an iPaaS/ETL
  connector built by a third party (TROCCO, Yoom, bundle and freee all publish Bakuraku
  connectors, none of them first-party). The packages listed below ARE first-party LayerX
  publications and are recorded for completeness, but none of them wraps the API, so no
  SDKs pointer is emitted for this provider — doing so would credit LayerX with a client
  library it has not written. LayerXcom's remaining 60 public repositories are the
  company's 2018-2021 blockchain-era research (Zerochain, CBC Casper, Plasma, zk-SNARK
  work) and are not maintained.
